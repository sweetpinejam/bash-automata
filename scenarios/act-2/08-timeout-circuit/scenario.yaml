id: act-2-08-timeout-circuit
act: 2
order: 8
title: "The Cascading Timeout Shield"
difficulty: Intermediate
timeout_seconds: 300

briefing:
  incident: "INCIDENT-1088: Upstream microservice network stalls cause worker processes to hang forever, exhausting connection pools. The deployment container lacks the GNU 'timeout' binary."
  task: "Implement a pure Bash timeout wrapper 'run_with_timeout' in 'gateway_caller.sh' that cancels hanging subprocesses after 1 second, reaps orphan processes, and returns code 124."
  constraints:
    - "Do NOT use the external 'timeout' command."
    - "Hanging commands must be interrupted and killed in under 2 seconds."
    - "Zero orphaned subshell or python processes lingering in process table."

limits:
  memory_limit: "64m"
  cpu_quota: "1.0"
  pids_limit: 50

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "fixtures/caller_broken.sh"
      dest: "workspace/gateway_caller.sh"
    - src: "fixtures/upstream_rpc.py"
      dest: "workspace/upstream_rpc.py"

verification:
  test_script: "verify.py"
  pass_criteria:
    - "Fast commands execute and complete normally with exit code 0"
    - "Hanging commands are interrupted after 1 second with exit code 124"
    - "No lingering orphan processes detected in kernel table"

hints:
  - "Diagnostic Phase: Inspect process tree behavior with 'ps -ef' or 'pgrep -a python3'. Notice that when upstream hangs, synchronous execution blocks the main shell thread forever, preventing any subsequent logic or health checks from running."
  - "Architectural Pattern: Implement dual-subshell concurrency. Fork the workload into the background using '&' and record its PID with '$!'. In parallel, fork a watchdog timer subshell that sleeps for the timeout threshold and sends an escalating signal sequence (SIGTERM followed by SIGKILL) to the worker PID."
  - "Synchronization Blueprint: The coordinator shell must wait on the worker PID. If the worker exits before the watchdog expires, cancel the watchdog subshell and reap it immediately to prevent lingering sleep processes. If the watchdog interrupts the worker, return standard POSIX timeout exit code 124."
