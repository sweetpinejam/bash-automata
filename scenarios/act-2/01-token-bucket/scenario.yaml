id: act-2-01-token-bucket
act: 2
order: 1
title: "The Token Bucket Semaphore"
difficulty: Intermediate
timeout_seconds: 300

briefing:
  incident: "INCIDENT-4290: An automated ingest bot fired 16 simultaneous API requests against the upstream gateway. The upstream rate-limiter banned the host IP with HTTP 429 Too Many Requests."
  task: "Implement a pure Bash counting semaphore to restrict maximum background concurrency to exactly 4 worker subshells at any point in time."
  constraints:
    - "Do NOT use xargs -P or GNU parallel."
    - "Do NOT serialize the jobs into single-threaded execution (must process concurrently up to limit 4)."
    - "Zero external dependencies: pure Bash named pipe and file descriptor semaphore."

limits:
  memory_limit: "64m"
  cpu_quota: "1.0"
  pids_limit: 50

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "fixtures/dispatcher_broken.sh"
      dest: "workspace/dispatcher.sh"
    - src: "fixtures/mock_api.py"
      dest: "workspace/mock_api.py"

verification:
  test_script: "verify.py"
  pass_criteria:
    - "All 16 queue jobs are processed successfully"
    - "Peak concurrent worker subshells never exceeds 4"
    - "Zero HTTP 429 rate limit breaches recorded in API telemetry ledger"

hints:
  - "Diagnostic: Inspect active file descriptors with 'ls -l /proc/$$/fd' and query 'api_state.json' after execution. Notice that without a semaphore, active jobs spike to 16, resulting in HTTP 429 rate-limiting breaches."
  - "Mechanism: A POSIX counting semaphore can be constructed in pure Bash using a named pipe (FIFO) bound to a bidirectional file descriptor (exec 3<>\"$FIFO\"). Opening bidirectional prevents EOF on empty reads."
  - "Blueprint: Pre-populate the descriptor with exactly 4 tokens, consume a token using 'read -u 3' prior to background forking, and return the token upon task completion inside the worker subshell."
