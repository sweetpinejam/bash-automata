id: "act-1-07-shm-bus"
act: 1
order: 7
title: "The Shared Memory Bus"
difficulty: "Intermediate"
timeout_seconds: 30

limits:
  memory_limit: "64m"
  cpu_quota: "1.0"
  pids_limit: 30

briefing:
  situation: "A high-frequency metrics logger ('writer.sh') writes telemetry snapshots into a disk-backed workspace directory. Disk I/O wait and filesystem journaling degrade ingestion throughput. To achieve sub-millisecond IPC latency, the ring buffer must be relocated to Linux shared memory (/dev/shm)."
  objective: "Refactor 'writer.sh' to write metric frames into the kernel tmpfs RAM disk at '/dev/shm/telemetry_bus.dat'. Ensure the shared memory segment is cleanly initialized, unlinked via an EXIT trap, and readable by 'consumer.py' with zero physical disk I/O."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "fixtures/writer_broken.sh"
      dest: "workspace/writer.sh"
    - src: "fixtures/consumer.py"
      dest: "workspace/consumer.py"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Telemetric bus located strictly in '/dev/shm/' RAM disk"
    - "Consumer reads 100 metric frames without disk I/O"
    - "Automatic unlinking of shared memory node upon termination"

hints:
  - "Diagnostic: Run 'mount | grep shm' and 'df -h /dev/shm' to inspect the kernel tmpfs mount. Use 'iostat -xz 1' to observe that disk-backed file writes generate physical storage queues while /dev/shm generates zero I/O."
  - "Mechanism: In Linux, '/dev/shm' is an in-memory tmpfs filesystem mapped directly to system DRAM page caches. However, directory nodes in /dev/shm persist until deleted; failing to unlink them causes RAM leaks."
  - "Blueprint: Relocate the telemetry stream buffer to '/dev/shm/telemetry_bus.dat', and register a POSIX 'trap ... EXIT' handler to guarantee the node is unlinked upon process termination."
