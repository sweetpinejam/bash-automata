id: "act-1-01-choked-pipe"
act: 1
order: 1
title: "The Choked Pipe"
difficulty: "Intermediate"
timeout_seconds: 60

limits:
  memory_limit: "64m"
  cpu_quota: "1.0"
  pids_limit: 50

briefing:
  situation: "High-frequency telemetry data is flooding into the ingest forwarder at 10,000 metrics/sec. The synchronous pipe between Bash and Python causes 64KB kernel buffer saturation, upstream write stalls, latency spikes, and severe packet loss."
  objective: "Refactor the Bash ingest forwarder ('ingest.sh') to decouple ingestion using an asynchronous named pipe ('mkfifo') and background worker lifecycle management. Guarantee zero data loss across high-throughput bursts while maintaining peak RSS under 64MB."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "fixtures/ingest_broken.sh"
      dest: "workspace/ingest.sh"
    - src: "fixtures/process_broken.py"
      dest: "workspace/process.py"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Named pipe (FIFO) correctly created and unlinked on exit"
    - "Zero records lost across high-throughput telemetry stream (25,000 records)"
    - "Peak resident memory (RSS) stays strictly under 64MB"
    - "Graceful shutdown with zero orphan processes or leaking FIFO nodes"

hints:
  - "Inspect pipe blocking using 'ls -l /proc/$PID/fd' and 'cat /proc/sys/fs/pipe-max-size'. When the 64KB kernel circular buffer saturates, the upstream producer enters the uninterruptible 'D' sleep state waiting on write(2)."
  - "Synchronous pipes ('cmd1 | cmd2') couple process execution to a single shared buffer. Decoupling requires a Named Pipe ('mkfifo'), which creates a dedicated filesystem node that can be consumed by an independent background process."
  - "Remember the POSIX FIFO open rule: opening a named pipe for writing blocks until a reader is attached. Spawn your background consumer first ('consumer < fifo &'), stream the input into the FIFO, and wait for the consumer PID."
