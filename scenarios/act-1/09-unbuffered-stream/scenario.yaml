id: "act-1-09-unbuffered-stream"
act: 1
order: 9
title: "The Unbuffered Stream"
difficulty: "Intermediate"
timeout_seconds: 30

limits:
  memory_limit: "64m"
  cpu_quota: "1.0"
  pids_limit: 30

briefing:
  situation: "A real-time telemetry pipeline ('pipeline.sh') pipes live event streams through filtering utilities ('producer.sh | grep ALERT | consumer.sh'). Because stdout automatically switches to 4KB block buffering when connected to a pipe, events are buffered in memory and arrive in delayed bursts, failing real-time latency thresholds."
  objective: "Refactor 'pipeline.sh' to enforce line buffering: use 'stdbuf -oL -eL' or tool-specific line-buffering flags ('grep --line-buffered') to ensure every event is flushed across the pipe instantly as soon as it is generated."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "fixtures/pipeline_broken.sh"
      dest: "workspace/pipeline.sh"
    - src: "fixtures/producer.sh"
      dest: "workspace/producer.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "'pipeline.sh' flushes events in real-time across the pipe"
    - "First 5 events arrive at consumer in <500ms (no 4KB block-buffer stall)"
    - "'events.stream' contains all streamed events"

hints:
  - "Diagnostic: Trace output writes using 'strace -e write bash pipeline.sh'. Notice that stdout issues writes only when 4096 bytes accumulate rather than on every newline."
  - "Mechanism: The GNU C library (glibc) queries 'isatty(3)'. When connected to a pipe or file, stdout switches to _IOFBF (block-buffered), trapping data inside user-space stdio memory."
  - "Blueprint: Force line-buffered mode (_IOLBF) on the filter utility using tool-specific flags like '--line-buffered' or wrap the command with GNU 'stdbuf -oL'."
