id: "act-1-06-atomic-swap"
act: 1
order: 6
title: "The Atomic Swap"
difficulty: "Intermediate"
timeout_seconds: 30

limits:
  memory_limit: "64m"
  cpu_quota: "1.0"
  pids_limit: 30

briefing:
  situation: "An automated zero-downtime deployment script ('swap.sh') updates the active symlink 'current' to point to 'releases/v2'. Because it uses non-atomic 'rm current && ln -s ...', active reader processes hit a transient window where 'current' does not exist, throwing 404/file-not-found errors."
  objective: "Refactor 'swap.sh' to execute a strictly atomic filesystem symlink swap using 'mv -T' (rename system call). Ensure high-concurrency traffic readers experience exactly ZERO missing-path errors during active release rotation."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "fixtures/swap_broken.sh"
      dest: "workspace/swap.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "'current' points to 'releases/v2' upon completion"
    - "Zero 404 / file-not-found errors across 10,000 rapid concurrent reader queries"
    - "Uses atomic 'mv -T' or rename idiom"

hints:
  - "Diagnostic: Run 'strace -e trace=unlink,symlink,rename,renameat2 bash swap.sh' to trace syscalls. Notice that 'rm' followed by 'ln -s' exposes an observable gap where the directory entry does not exist in VFS."
  - "Mechanism: The POSIX system call 'rename(2)' guarantees an atomic directory entry switch in the kernel dentry cache. GNU 'ln -sfn' does not use rename; it executes 'unlink' followed by 'symlink'."
  - "Blueprint: Stage the new target in a sibling temporary symlink isolated by PID, then execute an atomic in-place rename using GNU 'mv -T' (--no-target-directory) to replace the existing symlink without nesting."
