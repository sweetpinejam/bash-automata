id: "act-1-02-leaking-descriptor"
act: 1
order: 2
title: "The Leaking Descriptor"
difficulty: "Intermediate"
timeout_seconds: 30

limits:
  memory_limit: "64m"
  cpu_quota: "1.0"
  pids_limit: 30

briefing:
  situation: "An automated node health monitor daemon ('monitor.sh') dynamically allocates custom file descriptors in a polling loop to inspect device status files. Because it fails to release them, descriptors accumulate in the process table until hitting OS limits ('ulimit -n'), crashing with 'Too many open files'."
  objective: "Refactor 'monitor.sh' to manage the complete file descriptor lifecycle defensively: ensure allocated descriptors are explicitly closed using 'exec {fd}<&-' on every cycle, preventing table exhaustion across 50 polling cycles under a strict 'ulimit -n 25' ceiling."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "fixtures/monitor_broken.sh"
      dest: "workspace/monitor.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "'monitor.sh' completes 50 polling cycles with exit code 0"
    - "No file descriptor leaks in /proc/$$/fd under restrictive 'ulimit -n 25'"
    - "Health summary written to 'monitor.summary'"

hints:
  - "To inspect file descriptors allocated by a running shell process in real-time, list the symlinks in 'ls -l /proc/$$/fd'. When descriptor table exhaustion occurs, the kernel returns error code EMFILE: 'Too many open files'."
  - "Bash allows allocating dynamic file descriptors using 'exec {var}< \"$file\"' (assigning the lowest available integer >= 10). Unlike subshell redirects, descriptors opened with 'exec' remain open until explicitly closed."
  - "To close an input file descriptor and recycle its slot in the process table, use the redirection closure operator: 'exec {var}<&-'."
