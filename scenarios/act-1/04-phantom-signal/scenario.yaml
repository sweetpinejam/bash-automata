id: "act-1-04-phantom-signal"
act: 1
order: 4
title: "The Phantom Signal"
difficulty: "Intermediate"
timeout_seconds: 30

limits:
  memory_limit: "64m"
  cpu_quota: "1.0"
  pids_limit: 30

briefing:
  situation: "An infrastructure proxy daemon ('proxy.sh') must support zero-downtime hot reloading. When CI sends 'kill -HUP $PID' after updating 'app.conf', the daemon unexpectedly crashes because SIGHUP is untrapped (default action: terminate process). In addition, telemetry scrapers querying stats with 'SIGUSR1' are ignored."
  objective: "Harden 'proxy.sh' using UNIX signal traps: implement 'trap reload_config HUP' to hot-reload 'app.conf' without terminating the process, and 'trap dump_metrics USR1' to write current load into 'metrics.dump'."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "fixtures/proxy_broken.sh"
      dest: "workspace/proxy.sh"
    - src: "fixtures/app.conf"
      dest: "workspace/app.conf"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "'proxy.sh' stays running across SIGHUP and hot-reloads new config"
    - "Logs 'CONFIG_RELOADED' to 'proxy.log' with new configuration value"
    - "'proxy.sh' responds to SIGUSR1 by writing metrics to 'metrics.dump'"
    - "Gracefully terminates on SIGTERM with zero zombies"

hints:
  - "When an unhandled signal strikes a process, the Linux kernel executes the default disposition. For SIGHUP and SIGUSR1, the default action is immediate process termination (exit code 128 + signal number). Check running PIDs with 'ps -p $PID' to see if your daemon died."
  - "To catch signals without terminating, register custom functions using 'trap <func> HUP' and 'trap <func> USR1'. When a signal is caught, the kernel transfers control to your function and then resumes the main loop."
  - "Avoid foreground 'sleep N' in your loop; foreground commands block signal execution until they finish. Instead, use background sleep paired with the wait built-in ('sleep 0.1 & wait $! 2>/dev/null || true'), which unblocks immediately when signals arrive."
