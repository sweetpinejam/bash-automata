id: "act-1-05-orphan-graveyard"
act: 1
order: 5
title: "The Orphan Graveyard"
difficulty: "Intermediate"
timeout_seconds: 30

limits:
  memory_limit: "64m"
  cpu_quota: "1.0"
  pids_limit: 30

briefing:
  situation: "An automated batch worker supervisor ('supervisor.sh') continuously spawns worker tasks in the background. Because it never reaps terminating children, the Linux process table fills with zombie processes ('[defunct]'), risking system-wide PID starvation."
  objective: "Refactor 'supervisor.sh' to continuously reap finished child processes in real-time using 'wait -n' or 'trap ... CHLD'. Ensure 20 batch jobs complete with ZERO zombie processes lingering in the process table."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "fixtures/supervisor_broken.sh"
      dest: "workspace/supervisor.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "All 20 batch tasks execute and write to 'batch.done'"
    - "Zero zombie processes ('[defunct]') detected in 'ps aux' during and after execution"
    - "'supervisor.sh' exits 0 cleanly"

hints:
  - "Diagnostic: When child tasks complete in the background, check 'ps -eo pid,ppid,stat,comm | grep -w Z' or '/proc/$PID/status' to observe Zombie ('Z' / defunct) accumulation in the process table."
  - "Mechanism: A terminating process cannot free its Process Control Block (PCB) until its parent collects its exit status via 'wait(2)'. In Bash, sleeping instead of collecting child exit status causes zombie leaks."
  - "Blueprint: Replace the arbitrary 'sleep' synchronization delay with the POSIX child reaping primitive 'wait', which blocks until all child worker tasks terminate and clears their kernel table entries."
