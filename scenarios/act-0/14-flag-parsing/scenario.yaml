id: "act-0-14-flag-parsing"
act: 0
order: 14
title: "Flag & Argument Parsing"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated database migration CLI ('migrator.sh') naively assumes hardcoded argument order. It misparses values and crashes when CI passes reordered flags, attached values ('--env=prod'), or end-of-options markers."
  objective: "Build an enterprise CLI parser in 'migrator.sh' using the canonical 'while [[ $# -gt 0 ]]' loop, 'case' pattern matching, and 'shift'. Support short/long options, attached '=' syntax, validation bounds, and '--' delimiters, generating 'migration_plan.json'."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "migrator.sh"
      dest: "workspace/migrator.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Uses 'while [[ $# -gt 0 ]]' and 'shift' structure"
    - "Parses flags in arbitrary order with short and long aliases"
    - "Supports attached '=' syntax (--env=staging)"
    - "Rejects invalid environments, timeouts, and unknown options with exit 1"
    - "Generates valid 'migration_plan.json'"

hints:
  - "The parser skeleton: 'while [[ $# -gt 0 ]]; do case \"$1\" in -d|--dry-run) DRY_RUN=true; shift ;; ... esac; done'."
  - "Extract attached values: '--env=*) ENV=\"${1#*=}\"; shift ;;'"
  - "Consume space-separated options: '-e|--env) ENV=\"$2\"; shift 2 ;;'"
