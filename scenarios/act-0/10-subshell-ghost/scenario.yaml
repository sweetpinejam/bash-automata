id: "act-0-10-subshell-ghost"
act: 0
order: 10
title: "The Subshell Ghost"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated financial audit bot ('auditor.sh') produces empty reports and zero balances. The loop is piped from 'tail' ('tail | while'), causing all variable mutations to vanish inside an ephemeral child subshell upon loop termination."
  objective: "Build a multi-account financial reconciliation engine in 'auditor.sh' using Process Substitution ('done < <(tail -n +2 ...)') to preserve variable mutations in the parent shell. Track account balances, flag unauthorized large transactions, and emit 'audit_report.tsv'."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "auditor.sh"
      dest: "workspace/auditor.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "No pipeline '| while' constructs used"
    - "Uses process substitution '< <(tail ...)'"
    - "Preserves running financial balances and associative array state"
    - "Flags unauthorized transfers (>5000 with auth NONE) into 'fraud_alerts.log'"
    - "Generates valid 'audit_report.tsv' with exact metrics"

hints:
  - "Process substitution syntax: 'while IFS=, read -r ...; do ... done < <(tail -n +2 \"$INPUT_LEDGER\")'."
  - "Associative array declaration: 'declare -A BALANCES'."
  - "Update balances: 'BALANCES[\"$account_id\"]=$(( ${BALANCES[\"$account_id\"]:-0} + amount ))'."
