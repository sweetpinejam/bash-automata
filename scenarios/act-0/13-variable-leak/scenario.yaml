id: "act-0-13-variable-leak"
act: 0
order: 13
title: "The Variable Leak"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated multi-day backup job ('backup_bot.sh') prematurely halts after Day 1. Un-scoped variables in helper functions clobber the outer loop counters in global memory, destroying multi-day snapshots."
  objective: "Build a multi-day archival engine in 'backup_bot.sh' using strict 'local' variable scoping in helper functions. Guarantee that nested iterations do not leak or clobber outer caller state, generating 'backup_manifest.tsv'."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "backup_bot.sh"
      dest: "workspace/backup_bot.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Uses 'local' variable declarations inside all helper functions"
    - "Executes all days without premature loop termination"
    - "Generates valid 'backup_manifest.tsv' recording all chunks"
    - "Supports '--days' and '--manifest' command line options"

hints:
  - "In Bash, all variables in functions are global unless declared with 'local'."
  - "Declare local variables at the top of functions: 'local day=\"$1\" chunk_id'."
  - "Check that outer loop counter 'day_id' is not touched by inner functions."
