id: "act-0-12-stream-contract"
act: 0
order: 12
title: "The Stream Contract"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated incident triage probe emits interleaved data payloads and diagnostic errors. Dumping everything to stdout corrupts downstream consumers and hides critical alarms."
  objective: "Build a multi-stream router in 'triage.sh' using POSIX file descriptor redirections: separate FD 1 (clean data) into 'clean_payloads.log' and FD 2 (error alarms) into 'error_diagnostics.log' with zero cross-contamination, emitting 'stream_triage_report.json'."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "triage.sh"
      dest: "workspace/triage.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Uses '2>' stderr redirection and '>' stdout redirection"
    - "Zero error diagnostics contaminate 'clean_payloads.log'"
    - "Zero payload lines contaminate 'error_diagnostics.log'"
    - "Generates valid 'stream_triage_report.json'"
    - "Supports custom destination flags '--stdout-log' and '--stderr-log'"

hints:
  - "Redirect both streams simultaneously: 'command > \"$STDOUT_LOG\" 2> \"$STDERR_LOG\"'."
  - "Tee errors while redirecting: '2> >(tee \"$STDERR_LOG\" >&2)'."
  - "Calculate lines and bytes using 'wc -l < \"$file\"' and 'wc -c < \"$file\"'."
