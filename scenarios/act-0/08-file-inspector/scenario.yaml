id: "act-0-08-file-inspector"
act: 0
order: 8
title: "The File Inspector"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated deployment runner ('preflight.sh') blindly executes services without validating prerequisites. Zero-byte config files, missing execute permissions, and dangling symlinks cause disastrous production downtime."
  objective: "Build a robust deployment health auditor in 'preflight.sh' using POSIX file test operators: verify non-empty configs ('-s'), writable directories ('-d' && '-w'), executable binaries ('-x'), and symlink integrity ('-L' && '-e' to detect dangling links), emitting a structured 'health_report.json'."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "preflight.sh"
      dest: "workspace/preflight.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Uses file test operators '-s', '-d', '-x', '-L', and '-e'"
    - "Exits 0 and outputs 'ALL_CHECKS_PASSED' on healthy infrastructure"
    - "Detects zero-byte empty config files and exits 1"
    - "Detects non-executable binaries and exits 1"
    - "Detects dangling symlinks and exits 1"
    - "Generates valid JSON 'health_report.json'"

hints:
  - "Test non-empty regular file: '[[ -f \"$file\" && -s \"$file\" && -r \"$file\" ]]'."
  - "Test executable binary: '[[ -f \"$bin\" && -x \"$bin\" ]]'."
  - "Test symlink with valid target: '[[ -L \"$link\" && -e \"$link\" ]]'; if -L is true but ! -e, the symlink is dangling!"
