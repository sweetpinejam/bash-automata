id: "act-0-07-pattern-matcher"
act: 0
order: 7
title: "Pattern Matcher (Threat Classifier)"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated security event stream processes high-volume firewall logs. Piping logs into external utilities ('grep', 'awk', 'cut') causes packet drops and exhausts CPU. We need pure in-memory shell pattern matching."
  objective: "Build a high-throughput threat classifier in 'classifier.sh' using pure Bash regex ('[[ $line =~ $pattern ]]') and 'BASH_REMATCH'. Extract IP, port, and reason, classify severity and internal/external scope, and output 'threats.csv'."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "classifier.sh"
      dest: "workspace/classifier.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Zero external text manipulation binaries (grep, awk, cut, sed) spawned"
    - "Extracts capture groups using native 'BASH_REMATCH'"
    - "Accurately classifies threat severity (CRITICAL, HIGH, MEDIUM)"
    - "Accurately identifies network scope (INTERNAL vs EXTERNAL) using glob matching"
    - "Generates valid 'threats.csv' with all matched threats"

hints:
  - "Store regex pattern in variable: pattern='^ALERT[[:space:]]+ts=([0-9]+)...'."
  - "Match unquoted in brackets: '[[ \"$line\" =~ $pattern ]]'; extract '${BASH_REMATCH[1]}' etc."
  - "Check subnet with globs: '[[ \"$ip\" == 10.* || \"$ip\" == 192.168.* ]] && scope=INTERNAL'."
