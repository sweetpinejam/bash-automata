id: "act-0-07-pattern-matcher"
act: 0
order: 7
title: "Pattern & Regex Matching"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated security scanner ('classifier.sh') monitors firewall event feeds. It needs to filter critical 'ALERT' events and parse the attacker IP, port, and reason into 'threats.csv'. Spawning external regex engines like 'grep', 'sed', or 'awk' creates unnecessary overhead."
  objective: "Refactor 'classifier.sh' to use native Bash regex matching '=~' inside '[[ ... ]]' and extract capture groups using '${BASH_REMATCH[@]}'. Filter non-alerts and format alerts into 'threats.csv' without external binaries."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "classifier.sh"
      dest: "workspace/classifier.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "'classifier.sh' executes with exit code 0"
    - "No external regex tools ('grep', 'sed', 'awk', 'cut') spawned"
    - "Uses '=~' regex operator and '${BASH_REMATCH[...]}'"
    - "Generates 'threats.csv' containing only ALERT entries in CSV format 'IP,PORT,REASON'"

hints:
  - "Regex matching syntax in Bash: '[[ \"$string\" =~ regex_pattern ]]'"
  - "Captured parentheses groups are stored in the array '${BASH_REMATCH[1]}', '${BASH_REMATCH[2]}', etc."
  - "Match IP and Port with: '[[ \"$line\" =~ ip=([0-9.]+)[[:space:]]+port=([0-9]+)[[:space:]]+reason=([A-Z_]+) ]]'"
