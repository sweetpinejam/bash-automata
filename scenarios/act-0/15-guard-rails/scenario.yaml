id: "act-0-15-guard-rails"
act: 0
order: 15
title: "Short-Circuit Guard Rails"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated build publication pipeline ('publisher.sh') suffers from the deeply nested Arrow Anti-Pattern ('if [ $? -eq 0 ]...'). It continues attempting downstream packaging steps even when validation fails, packaging corrupt data."
  objective: "Build a fail-fast release deployment pipeline in 'publisher.sh' using short-circuit guard rails ('command || { log_error; exit 1; }'). Perform semantic validation, sha256 checksumming, and tar archive packaging with real Linux tools and zero artificial mocks."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "publisher.sh"
      dest: "workspace/publisher.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Uses short-circuit '|| { ...; }' guard patterns"
    - "Zero nested 'if [ $? -eq 0 ]' blocks"
    - "Fails fast and exits 1 immediately if version format is invalid"
    - "Packages 'dist/release.tar.gz' and generates 'dist/manifest.sha256'"

hints:
  - "Short-circuit pattern: 'command || { echo \"FATAL: Step failed\" >&2; exit 1; }'."
  - "Remember the syntax rules of { ...; }: required whitespace after { and before }, and semicolon after exit 1."
  - "Use real tools: sha256sum for checksums, tar for archives."
