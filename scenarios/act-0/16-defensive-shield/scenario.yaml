id: "act-0-16-defensive-shield"
act: 0
order: 16
title: "The Defensive Shield"
difficulty: "Intermediate"
timeout_seconds: 30

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 30

briefing:
  situation: "Unattended production deployment automation is running with permissive shell defaults. Pipelined upstream crashes are silently masked, unbound variables expand to empty strings, and failed steps leave no crash diagnostics."
  objective: "Harden 'deploy.sh' by enabling strict defensive execution ('set -euo pipefail'), binding required variables safely, and registering an 'ERR' trap that emits crash metadata ('deploy_crash.dump') on failure."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "deploy.sh"
      dest: "workspace/deploy.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "'deploy.sh' enforces 'set -euo pipefail'"
    - "Unbound variables trigger immediate fatal error under 'set -u'"
    - "Upstream pipeline crashes are trapped and abort execution under 'set -o pipefail'"
    - "Unhandled errors fire 'on_failure' and generate 'deploy_crash.dump' via 'trap ... ERR'"
    - "Successful executions generate 'deploy_status.json' and summary output"

hints:
  - "The defensive shell triad is 'set -euo pipefail' placed at the top of the script."
  - "Use 'trap '\''on_failure \"$LINENO\" \"$BASH_COMMAND\" \"$?\"'\'' ERR' to capture diagnostic crash context."
  - "Under 'set -u', expanding '${1:-$DEPLOY_ENV}' will safely inspect $1, but if $DEPLOY_ENV is unset, it halts with an unbound variable error."
