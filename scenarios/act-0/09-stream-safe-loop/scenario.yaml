id: "act-0-09-stream-safe-loop"
act: 0
order: 9
title: "Stream-Safe While Loops"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated config compiler ('compiler.sh') corrupts configuration files. Using a broken 'for line in $(cat ...)' loop erases leading indentation, mangles backslashes in regex, and drops lines lacking trailing newlines."
  objective: "Build a high-fidelity template compiler in 'compiler.sh' using the canonical Bash stream-safe loop: 'while IFS= read -r line || [[ -n \"$line\" ]]; do ... done < template.conf'. Support comment stripping and dynamic placeholder substitution with 100% byte fidelity."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "compiler.sh"
      dest: "workspace/compiler.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "No 'for ... in $(cat ...)' loops used"
    - "Uses 'while IFS= read -r line' construct"
    - "Preserves exact whitespace indentation and regex backslashes"
    - "Preserves final lines lacking trailing newlines"
    - "Supports '--strip-comments' and dynamic '--var KEY=VAL' substitutions"

hints:
  - "The canonical stream loop: 'while IFS= read -r line || [[ -n \"$line\" ]]; do ... done < \"$file\"'."
  - "IFS= clears field splitting, preserving spaces; -r disables backslash escaping."
  - "Substitute placeholders: 'line=\"${line//\\{\\{$key\\}\\}/$val}\"'."
