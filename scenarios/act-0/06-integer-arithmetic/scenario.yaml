id: "act-0-06-integer-arithmetic"
act: 0
order: 6
title: "Integer Arithmetic"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated real-time traffic monitoring bot ('aggregator.sh') crunches request logs. The script relies on archaic 'expr' subprocess calls, exhausting process limits and failing to calculate average latency, error percentages, and SLA compliance."
  objective: "Build a high-throughput metrics engine in 'aggregator.sh' using pure Bash integer arithmetic ('(( ... ))' and '$(( ... ))'). Track latency distributions, status code buckets, and SLA compliance percentages, then generate 'metrics_rollup.tsv'."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "aggregator.sh"
      dest: "workspace/aggregator.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Zero external arithmetic utilities (expr, bc, awk, dc) used"
    - "Calculates accurate TOTAL_REQS, AVG_LATENCY, MIN_LATENCY, and MAX_LATENCY"
    - "Accurately buckets status codes and computes SLA compliance % and error %"
    - "Evaluates SLA breach criteria and generates 'metrics_rollup.tsv'"

hints:
  - "Increment safely under set -e: '(( ++TOTAL_REQS ))' or '(( TOTAL_REQS += 1 ))'."
  - "Accumulate sums: '(( TOTAL_LATENCY += latency ))'."
  - "Integer division: 'AVG_LATENCY=$(( TOTAL_LATENCY / TOTAL_REQS ))'."
