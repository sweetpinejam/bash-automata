id: "act-0-11-command-dispatcher"
act: 0
order: 11
title: "The Command Dispatcher"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An infrastructure service control wrapper ('service_ctl.sh') uses fragile nested if/elif blocks. It leaves stale PID files, permits duplicate daemon instances, and silently ignores invalid commands."
  objective: "Build a production daemon supervisor in 'service_ctl.sh' using 'case ... in ... esac'. Manage PID file lifecycles with 'kill -0', detect and self-heal stale PID files, handle 'start', 'stop', 'restart', 'status', grouped help flags, and wildcard error handling."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "service_ctl.sh"
      dest: "workspace/service_ctl.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Uses 'case ... in ... esac' command dispatcher"
    - "Manages background process PID file and rejects duplicate starts"
    - "Accurately detects running processes vs stale PID files with 'kill -0'"
    - "Handles grouped help flags ('-h|--help|help') with exit 0"
    - "Rejects unknown commands with exit code 1"

hints:
  - "The case structure: 'case \"$ACTION\" in start) ... ;; stop) ... ;; *) ... ;; esac'."
  - "Check if process is alive: 'kill -0 \"$pid\" 2>/dev/null'."
  - "Save background process PID: 'sleep 300 &; echo $! > \"$PID_FILE\"'."
