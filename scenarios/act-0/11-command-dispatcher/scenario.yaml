id: "act-0-11-command-dispatcher"
act: 0
order: 11
title: "The Command Dispatcher"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An infrastructure service control wrapper ('service_ctl.sh') uses fragile, nested 'if/elif' blocks. It fails to handle invalid actions cleanly, lacks pattern grouping for help flags ('-h|--help'), and permits unhandled commands to succeed silently with exit code 0."
  objective: "Refactor 'service_ctl.sh' to use a modern, idiomatic Bash 'case ... in ... esac' dispatcher. Implement clean handlers for 'start', 'stop', 'status', grouped help flags ('-h|--help|help'), and a wildcard catch-all ('*') that exits with status 1 on unknown commands."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "service_ctl.sh"
      dest: "workspace/service_ctl.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "'service_ctl.sh' uses 'case ... in ... esac' construct"
    - "'start' creates 'service.pid' and exits 0"
    - "'status' reports running or stopped status accurately and exits 0"
    - "'stop' removes 'service.pid' and exits 0"
    - "'-h', '--help', and 'help' print usage information and exit 0"
    - "Unknown actions exit with status 1"

hints:
  - "The syntax for a case dispatcher is: 'case \"$ACTION\" in pattern1) ... ;; pattern2) ... ;; *) ... ;; esac'."
  - "Group alternate patterns using pipe '|': '-h|--help|help)'."
  - "Always terminate each branch with double semicolons ';;'."
  - "Always provide a fallback error handler: '*) echo \"Invalid command\" >&2; exit 1 ;;'"
