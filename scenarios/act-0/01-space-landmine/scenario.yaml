id: "act-0-01-space-landmine"
act: 0
order: 1
title: "The Space Landmine (Cleanup Bot)"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated CI/CD cleanup bot sweeps build artifacts across directories containing spaces and nested subdirectories. Unquoted variables cause Word Splitting, causing file loss and crashing sweeps."
  objective: "Build a robust CLI archival utility in 'cleaner.sh' that supports '--dry-run', validates arguments, traverses directories without word splitting, calculates file count and bytes, and records a tab-separated manifest."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "cleaner.sh"
      dest: "workspace/cleaner.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Rejects invalid arguments and non-existent directories with exit code 1"
    - "Executes '--dry-run' without moving files or creating destination folders"
    - "Safely moves all nested files with spaces and generates 'manifest.tsv'"
    - "Outputs structured summary: 'SWEEP_COMPLETE: files=<N>, bytes=<B>, dry_run=<0|1>'"

hints:
  - "Parse '--dry-run' using 'if [[ \"${1:-}\" == \"--dry-run\" ]]; then DRY_RUN=1; shift; fi'."
  - "Scan files safely using 'while IFS= read -r -d \"\" file; do ... done < <(find \"$SRC_DIR\" -type f -print0)'."
  - "Keep wildcards and parameter expansions quoted: \"$DEST_DIR\", \"$file\", \"${file##*/}\"."
