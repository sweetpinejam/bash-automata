id: "act-0-03-string-surgeon"
act: 0
order: 3
title: "The String Surgeon (Artifact Sorter)"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated CI/CD artifact pipeline chokes CPU and breaches container PID limits because its sorting script forks external binaries ('basename', 'dirname', 'cut', 'sed') for every incoming package."
  objective: "Build a high-performance in-memory artifact cataloguer in 'sorter.sh' using pure Bash parameter expansion (${VAR##*/}, ${VAR%/*}, ${VAR%.*}). Handle compound extensions (.tar.gz, .backup.sql) and files without extensions, sort them into categorized directories, and generate 'catalog.tsv'."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "sorter.sh"
      dest: "workspace/sorter.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Zero banned subshell utilities (basename, dirname, cut, sed, awk, tr) used"
    - "Correctly extracts compound extensions (tar.gz, backup.sql) and no-extension binaries (none)"
    - "Moves artifacts into categorized subfolders (archives, configs, databases, binaries)"
    - "Generates 'catalog.tsv' with exact metadata fields: BASENAME, CATEGORY, STEM, EXT"

hints:
  - "Strip directory prefix: filename=\"${filepath##*/}\"."
  - "Extract compound extensions with case: *.tar.gz) ext=\"tar.gz\"; stem=\"${filename%.tar.gz}\" ;;."
  - "Extract standard extension: ext=\"${filename##*.}\"; stem=\"${filename%.*}\"."
