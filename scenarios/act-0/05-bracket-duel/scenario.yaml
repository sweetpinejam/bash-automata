id: "act-0-05-bracket-duel"
act: 0
order: 5
title: "The Bracket Duel"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated deployment gate ('validator.sh') crashes with syntax errors whenever arguments are empty or contain spaces because of legacy single brackets '[' and '-a'/'-o' operators."
  objective: "Build a robust multi-environment pre-flight policy engine in 'validator.sh' using modern compound brackets '[[ ]]'. Enforce replica limits, branch safety rules, and environment constraints cleanly."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "validator.sh"
      dest: "workspace/validator.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Zero legacy single brackets '[' or '-a'/'-o' flags used"
    - "Gracefully handles empty strings, whitespace, and non-numeric inputs"
    - "Rejects invalid replicas (<1 or >50) and unapproved branches"
    - "Outputs correct approval and rejection verdicts with matching exit codes"

hints:
  - "Use '[[ -z \"${TARGET_ENV// /}\" ]]' to check for empty or whitespace-only strings."
  - "Regex check in brackets: '[[ \"$REPLICAS\" =~ ^[0-9]+$ ]] && (( REPLICAS >= 1 && REPLICAS <= 50 ))'."
  - "Pattern matching on branch: '[[ \"$BRANCH\" != \"main\" && \"$BRANCH\" != release/* ]]'."
