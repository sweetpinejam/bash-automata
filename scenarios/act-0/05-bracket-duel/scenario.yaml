id: "act-0-05-bracket-duel"
act: 0
order: 5
title: "The Bracket Duel"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated pre-flight deployment check ('validator.sh') repeatedly crashes with '[: =: unary operator expected' whenever TARGET_ENV is empty or contains spaces. It is using POSIX '[' instead of modern Bash '[[ ]]'. In addition, combined expressions use fragile '-a' flags."
  objective: "Modernize 'validator.sh' by replacing all single brackets '[' with compound test brackets '[[ ]]' and replacing legacy '-a' / '-o' flags with native '&&' / '||'. Ensure the script handles empty and whitespace-filled variables gracefully."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "validator.sh"
      dest: "workspace/validator.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "'validator.sh' executes with exit code 0 when testing empty, space-delimited, and valid environments"
    - "All single brackets '[' replaced with compound '[[ ]]'"
    - "No legacy '-a' or '-o' operators used inside test expressions"
    - "Prints correct approval/rejection verdicts based on TARGET_ENV and DEPLOY_TIER"

hints:
  - "The single bracket '[' is actually an alias for the '/bin/[' command, subject to word-splitting."
  - "The double bracket '[[ ]]' is a Bash keyword that disables word splitting and pathname expansion."
  - "Inside '[[ ]]', use native logical operators: '[[ expr1 && expr2 ]]' instead of '[ expr1 -a expr2 ]'."
