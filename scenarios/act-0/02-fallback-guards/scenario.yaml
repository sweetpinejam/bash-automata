id: "act-0-02-fallback-guards"
act: 0
order: 2
title: "Default Fallbacks & Guards"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated deployment injector ('env_injector.sh') generates runtime configuration. Missing optional variables cause crashes under 'set -u', while missing secrets lead to silent corruption. Sensitive tokens are accidentally leaked in logs."
  objective: "Build a production environment compiler in 'env_injector.sh': apply parameter expansion fallbacks (${VAR:-def}), assert mandatory secrets (${VAR:?err}), derive alternate variables (${VAR:+alt}), enforce numeric port bounds, create files with 0600 permissions, and mask secrets in logs."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "env_injector.sh"
      dest: "workspace/env_injector.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Aborts with non-zero exit code if API_SECRET or CLUSTER_NAME is missing"
    - "Rejects port values outside 1024..65535"
    - "Supplies defaults for PORT, DB_HOST, DB_PORT, LOG_LEVEL, and TIMEOUT_SECONDS"
    - "Derives METRICS_ENABLED via alternate parameter expansion"
    - "Generates .env.runtime with 0600 permissions and masks secrets in console logs"

hints:
  - "Default fallback syntax: PORT=\"${PORT:-8080}\", DB_HOST=\"${DB_HOST:-127.0.0.1}\"."
  - "Mandatory guard assertion: : \"${API_SECRET:?API_SECRET is required}\"."
  - "Alternate value derivation: METRICS_ENABLED=\"${PROMETHEUS_ENDPOINT:+true}\"; METRICS_ENABLED=\"${METRICS_ENABLED:-false}\"."
