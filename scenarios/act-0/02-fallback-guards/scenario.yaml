id: "act-0-02-fallback-guards"
act: 0
order: 2
title: "Default Fallbacks & Guards"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated deployment injector ('env_injector.sh') generates a runtime configuration file (.env). If optional variables are omitted, it crashes under 'set -u' instead of providing sane defaults. Furthermore, it fails to enforce mandatory secrets."
  objective: "Refactor 'env_injector.sh' using Bash parameter expansion: provide default fallbacks for PORT (default: '8080') and DB_HOST (default: 'localhost') using '${VAR:-default}', and guard API_SECRET using '${VAR:?API_SECRET is required}'."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "env_injector.sh"
      dest: "workspace/env_injector.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "'env_injector.sh' sets PORT to 8080 when PORT is unset"
    - "'env_injector.sh' sets DB_HOST to localhost when DB_HOST is unset"
    - "'env_injector.sh' preserves custom PORT and DB_HOST when provided"
    - "'env_injector.sh' exits with non-zero error when API_SECRET is unset"
    - "Generates valid .env file containing expected key-values"

hints:
  - "To supply a default when a variable is unset or empty, use: '${VAR:-default}'."
  - "To abort execution with an error when a mandatory variable is missing, use: '${VAR:?error_message}'."
  - "Remember to quote your expansions: PORT=\"${PORT:-8080}\"."
