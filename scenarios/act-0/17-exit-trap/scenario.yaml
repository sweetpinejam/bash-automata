id: "act-0-17-exit-trap"
act: 0
order: 17
title: "The Exit Trap & Zero-Pollution Cleanup"
difficulty: "Intermediate"
timeout_seconds: 30

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 30

briefing:
  situation: "Automated jobs provision isolated scratch build sandboxes and PID lockfiles. When scripts crash or receive termination signals, naive sequential cleanup at the end is bypassed, leaking directories and deadlocking future runs."
  objective: "Implement a deterministic resource cleanup handler in 'job.sh' and register it via 'trap cleanup EXIT INT TERM', guaranteeing zero leaked sandboxes or PID locks across normal exits, crash aborts, and external signals."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "job.sh"
      dest: "workspace/job.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "'job.sh' defines 'cleanup' and registers 'trap cleanup EXIT INT TERM'"
    - "Scratch sandboxes are purged unconditionally upon normal completion"
    - "Scratch sandboxes and PID files are purged upon unhandled crash failures"
    - "Scratch sandboxes and PID files are purged when SIGTERM is injected"
    - "Original exit codes are preserved across cleanup execution"

hints:
  - "Register 'trap cleanup EXIT INT TERM' *before* creating the scratch directory."
  - "Capture 'local exit_status=$?' as the very first line of 'cleanup()' so commands like 'echo' don't overwrite the exit status."
  - "Always verify '[[ -n \"${SCRATCH_DIR:-}\" && -d \"$SCRATCH_DIR\" ]]' before running 'rm -rf'."
