id: "act-0-20-heredoc-forge"
act: 0
order: 20
title: "The Heredoc Template Forge"
difficulty: "Intermediate"
timeout_seconds: 30

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 30

briefing:
  situation: "Automated configuration provisioning scripts are corrupting systemd unit files, proxy configurations, and generated shell wrappers because unquoted heredocs expand literal tokens ($MAINPID, $1, $@) into empty strings."
  objective: "Refactor 'forge.sh' to use the appropriate Heredoc modalities: unquoted '<<EOF' with escaped '\$MAINPID' for 'service.conf', tab-stripped '<<-EOF' for indented 'proxy.conf', and quoted literal '<<\'EOF\'' for 'run.sh'."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "forge.sh"
      dest: "workspace/forge.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "'forge.sh' uses unquoted '<<EOF' for 'service.conf' and escapes '\$MAINPID'"
    - "'forge.sh' uses tab-stripped '<<-EOF' for indented 'proxy.conf'"
    - "'forge.sh' uses quoted '<<\'EOF\'' for 'run.sh' and marks it executable"
    - "Generated 'run.sh' preserves literal '$1' and '$@' and executes correctly"
    - "All artifacts and byte sizes are cataloged into 'forge_manifest.json'"

hints:
  - "In unquoted heredocs, escape dollar signs with backslash: 'ExecReload=/bin/kill -HUP \$MAINPID'."
  - "To strip leading tabs from an indented heredoc inside a function, use 'cat <<-EOF' and indent with hard TAB characters."
  - "To treat heredoc contents completely literally without any variable expansion, quote the delimiter: 'cat <<'\''EOF'\'' > run.sh'."
