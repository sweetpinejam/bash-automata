id: "act-0-18-lockfile-mutex"
act: 0
order: 18
title: "The Lockfile Mutex & Stale Lock Recovery"
difficulty: "Intermediate"
timeout_seconds: 30

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 30

briefing:
  situation: "Cron sync workers are suffering from race conditions and split-brain writes due to non-atomic file tests. Additionally, when workers crash or get killed, abandoned lockfiles permanently deadlock all future runs."
  objective: "Refactor 'worker.sh' to use atomic 'mkdir' mutual exclusion, implement PID attribution and liveness auditing with 'kill -0 $owner_pid' to self-heal stale locks, and ensure exit traps automatically unlock on termination."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "worker.sh"
      dest: "workspace/worker.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "'worker.sh' acquires mutex via atomic 'mkdir' (prohibits 'mkdir -p')"
    - "Concurrent execution collision is detected and rejected with 'LOCK_ACQUIRE_FAILED'"
    - "Stale locks from dead PIDs are detected and reclaimed automatically"
    - "Lock directory is unlinked automatically via 'trap ... EXIT'"
    - "Event batch is processed cleanly into 'sync_summary.json'"

hints:
  - "Atomic directory creation: 'mkdir \"$LOCK_DIR\" 2>/dev/null && echo \"\$\$\" > \"$LOCK_DIR/pid\"'."
  - "Stale lock check: read the PID from '$LOCK_DIR/pid' and test 'kill -0 \"$owner_pid\" 2>/dev/null'."
  - "If 'kill -0' returns non-zero, the owner process is dead and the lock can be safely purged."
