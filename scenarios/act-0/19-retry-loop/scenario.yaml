id: "act-0-19-retry-loop"
act: 0
order: 19
title: "The Exponential Backoff Retry Loop"
difficulty: "Intermediate"
timeout_seconds: 30

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 30

briefing:
  situation: "Microservice deployment pipelines are failing intermittently because deployment bots run single naive probes against newly deployed containers before internal caches warm up and database connection pools initialize."
  objective: "Refactor 'probe.sh' into a resilient readiness probe using pure Bash integer arithmetic exponential backoff and real 'curl' queries, logging attempt telemetry and emitting 'probe_summary.json'."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "probe.sh"
      dest: "workspace/probe.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "'probe.sh' implements exponential backoff polling via 'while' or 'for'"
    - "Backoff delay doubles on failure ('delay *= 2') and is capped at 'MAX_DELAY'"
    - "Probes real endpoints using 'curl -s -f -m 2'"
    - "Logs attempt history into 'probe_attempts.log'"
    - "Generates 'probe_summary.json' with 'SERVICE_READY' on success or 'TIMEOUT' on exhaustion"

hints:
  - "Query the target endpoint using 'curl -s -f -m 2 \"$TARGET_URL\"'."
  - "Double delay using pure Bash arithmetic: '(( delay *= 2 ))'."
  - "Do not sleep after the final attempt has failed; break out of the loop immediately."
