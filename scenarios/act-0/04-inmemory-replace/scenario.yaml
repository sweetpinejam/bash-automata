id: "act-0-04-inmemory-replace"
act: 0
order: 4
title: "Pure In-Memory Replace"
difficulty: "Beginner"
timeout_seconds: 15

limits:
  memory_limit: "32m"
  cpu_quota: "1.0"
  pids_limit: 20

briefing:
  situation: "An automated log shipping daemon must scrub sensitive internal domains, secrets, and debug prefixes before exporting event logs. Piping every line into 'sed' exhausts container process limits."
  objective: "Build a high-volume streaming log sanitizer in 'sanitizer.sh' using pure Bash parameter replacements (${VAR//pat/rep}, ${VAR/#pat/rep}, ${VAR/%pat/rep}). Scrub internal domains, redact tokens, strip session suffixes, handle EOF lines safely, and generate 'audit_metrics.json'."

files:
  workspace_dir: "workspace"
  initial_files:
    - src: "sanitizer.sh"
      dest: "workspace/sanitizer.sh"

verification:
  test_script: "verify.py"
  chaos_command: ""
  pass_criteria:
    - "Zero external subshell processes (sed, awk, perl, python, cut) spawned"
    - "Stream reads all lines including lines without trailing newline"
    - "Replaces dev.internal with prod.external and SECRET_ with REDACTED_"
    - "Applies prefix replacement (DEBUG: -> [TRACE]:) and suffix stripping (?session=*)"
    - "Generates valid 'audit_metrics.json' with metrics"

hints:
  - "Prefix replacement: line=\"${line/#DEBUG:/[TRACE]:}\"."
  - "Global replacement: line=\"${line//dev.internal/prod.external}\"."
  - "Suffix replacement: line=\"${line/%\\?session=*/}\" (escape the question mark!)."
